name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Type-check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  browser:
    name: Browser checks (WebGPU on SwiftShader)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm run test:e2e
        env:
          REQUIRE_WEBGPU: "1"

  reference:
    name: Reference fixtures reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r reference/requirements.txt
      - run: cp -r tests/fixtures "$RUNNER_TEMP/committed"
      - run: python reference/generate_fixtures.py
      - name: Regenerated fixtures equal the committed ones
        run: python reference/compare_fixtures.py "$RUNNER_TEMP/committed" tests/fixtures
      - name: Examples are unchanged
        run: git diff --exit-code -- examples

  pages:
    name: Upload site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, browser, reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
